name: Build Custom gta4lve Kernel (Torkey-Next)

on:
  workflow_dispatch:

jobs:
  build-custom-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev \
        libelf-dev xz-utils wget curl ccache libncurses-dev rsync \
        kmod lz4 pkg-config python3 python-is-python3 device-tree-compiler \
        zstd unzip cpio libyaml-dev

    - name: Download Toolchain
      run: |
        mkdir -p prebuilts/gcc/linux-x86/aarch64
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          --depth=1 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

    - name: Fix Config and Warnings
      run: |
        # إيقاف معلومات التصحيح
        sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/g' arch/arm64/configs/gta4lvexx_defconfig || true
        echo "# CONFIG_DEBUG_INFO is not set" >> arch/arm64/configs/gta4lvexx_defconfig
        
        # تعطيل Werror لمنع توقف البناء عند التحذيرات
        find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true

    - name: Build Kernel
      run: |
        mkdir -p out
        export CROSS_COMPILE=$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        
        # تعطيل معلومات التصحيح والـ DWARF
        export KCFLAGS="-g0 -Wno-error -Wno-unused-but-set-variable"
        export KBUILD_CFLAGS_KERNEL="-g0"
        export CFLAGS="-g0"
        
        echo "📝 إنشاء ملف التكوين..."
        make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          gta4lvexx_defconfig
        
        echo "⚙️  تحديث التكوين..."
        make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          olddefconfig
          
        echo "🚀 بدء البناء..."
        make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          KCFLAGS="$KCFLAGS" \
          -j$(nproc) 2>&1 | tee build.log

    - name: Upload Output Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: gta4lve-Torkey-Next-Kernel
        path: out/arch/arm64/boot/Image
        if-no-files-found: ignore

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore

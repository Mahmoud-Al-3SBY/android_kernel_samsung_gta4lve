name: Build Custom gta4lve Kernel (Torkey-Next)

on:
  workflow_dispatch:

jobs:
  build-custom-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev \
        libelf-dev xz-utils wget curl ccache libncurses-dev rsync \
        kmod lz4 pkg-config python3 python-is-python3 device-tree-compiler \
        zstd unzip cpio libyaml-dev clang-15 lld llvm-15

    - name: Download Toolchain
      run: |
        mkdir -p prebuilts/gcc/linux-x86/aarch64
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          --depth=1 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

    - name: Fix Config and Warnings
      run: |
        sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/g' arch/arm64/configs/gta4lve_eur_open_defconfig
        echo "# CONFIG_DEBUG_INFO is not set" >> arch/arm64/configs/gta4lve_eur_open_defconfig
        find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true

    - name: Build Kernel
      run: |
        mkdir -p out
        export CROSS_COMPILE=$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        
        # إضافة CLANG_TRIPLE للتعريف ببيئة البناء
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        export KCFLAGS="-g0 -Wno-error -Wno-unused-but-set-variable -fno-dwarf2-cfi-asm"
        export KBUILD_CFLAGS_KERNEL="-g0"
        
        # إنشاء ملف التكوين
        make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CC=clang-15 LD=ld.lld \
          AR=llvm-ar-15 NM=llvm-nm-15 OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 STRIP=llvm-strip-15 \
          DEBUG_CFLAGS="" KCFLAGS="$KCFLAGS" \
          KBUILD_CFLAGS_KERNEL="$KBUILD_CFLAGS_KERNEL" \
          gta4lve_eur_open_defconfig
        
        # تحديث التكوين
        make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CC=clang-15 LD=ld.lld \
          AR=llvm-ar-15 NM=llvm-nm-15 OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 STRIP=llvm-strip-15 \
          DEBUG_CFLAGS="" KCFLAGS="$KCFLAGS" \
          KBUILD_CFLAGS_KERNEL="$KBUILD_CFLAGS_KERNEL" \
          olddefconfig
          
        echo "🚀 بدء البناء الفعلي..."
        # بناء الـ kernel
        make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CC=clang-15 LD=ld.lld \
          AR=llvm-ar-15 NM=llvm-nm-15 OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 STRIP=llvm-strip-15 \
          DEBUG_CFLAGS="" KCFLAGS="$KCFLAGS" \
          KBUILD_CFLAGS_KERNEL="$KBUILD_CFLAGS_KERNEL" \
          -j$(nproc)

    - name: Upload Output Kernel
      uses: actions/upload-artifact@v4
      with:
        name: gta4lve-Torkey-Next-Kernel
        path: out/arch/arm64/boot/Image
